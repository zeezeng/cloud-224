server:
  port: 8080

spring:
  application:
    name: mars-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mars-system?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 10
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.mars.common.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ======================== Sa-Token 配置 ========================
sa-token:
  # token 名称（同时也是 cookie 名称、header 提交的参数名称）
  token-name: Authorization
  # token 有效期（单位：秒），默认30天，-1代表永不过期
  timeout: 86400
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: 86400
  # 是否允许同一账号多地同时登录（为 true 时允许一起登录，为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token（为 true 时所有登录共用一个 token，为 false 时每次登录新建一个 token）
  is-share: true
  # token 风格（uuid: UUID风格, simple-uuid: 简洁UUID, random-32: 随机32位字符串, random-64: 随机64位字符串, random-128: 随机128位字符串, tik: tik风格）
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  # 是否尝试从请求体里读取 token
  is-read-body: false
  # 是否尝试从 cookie 里读取 token
  is-read-cookie: false
  # 是否尝试从 header 里读取 token
  is-read-header: true
  # 是否在初始化配置时打印版本字符画
  is-print: true
  # 是否在登录后将 token 写入响应头
  is-write-header: false
  # jwt 秘钥（如果使用 jwt 模式则需要配置）
  # jwt-secret-key: your-secret-key

# ======================== 应用配置 ========================
mars:
  # 演示模式配置（此处为开发环境默认值，生产环境请在 application-prod.yml 中配置）
  # true: 开启演示模式，禁止新增、编辑、删除操作
  # false: 关闭演示模式，允许所有操作
  demo-mode: false

# 日志配置
logging:
  level:
    com.mars: debug
