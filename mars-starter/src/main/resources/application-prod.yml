server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mars-admin
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mars-system?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin123
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      filter:
        stat:
          enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    encoding: UTF-8
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:10}
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.mars.common.entity,com.mars.system.entity,com.mars.file.entity,com.mars.gen.entity,com.mars.message.entity,com.mars.mall.entity,com.mars.job.entity,com.mars.biz.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0


# ======================== 应用配置 ========================
mars:
  # 演示模式配置（此处为开发环境默认值，生产环境请在 application-prod.yml 中配置）
  # true: 开启演示模式，禁止新增、编辑、删除操作
  # false: 关闭演示模式，允许所有操作
  demo-mode: ${MARS_DEMO_MODE:false}

  # 斗鱼实时数据监听（当前方案已废弃，默认关闭；如需启用置为 true 并确保服务器可访问弹幕端口）
  douyu:
    monitor:
      enabled: ${MARS_DOUYU_MONITOR_ENABLED:false}
      hosts: ${MARS_DOUYU_HOSTS:wss://danmuproxy.douyu.com:8501,wss://danmuproxy.douyu.com:8502,wss://danmuproxy.douyu.com:8503,wss://danmuproxy.douyu.com:8504,wss://danmuproxy.douyu.com:8505,wss://danmuproxy.douyu.com:8506}

# 日志配置
logging:
  level:
    com.mars: ${APP_LOG_LEVEL:info}
